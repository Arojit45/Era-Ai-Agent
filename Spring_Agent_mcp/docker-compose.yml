services:
  mysql:
    image: 'mysql:latest'
    container_name: "mcpDB"
    environment:
      - 'MYSQL_DATABASE=myAgentDB'
      - 'MYSQL_USER=mysqlUser'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=PASS'
    ports:
      - '3306:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
    healthcheck:
      test: ['CMD','mysqladmin','ping','-h','localhost','-uroot','-pverysceret']
      interval: 10s
      timeout: 5s
      start_period: 30s