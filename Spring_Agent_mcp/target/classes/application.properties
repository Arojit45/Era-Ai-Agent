spring.application.name=Spring_Agent_mcp
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/myAgentDB
spring.datasource.username=mysqlUser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.name=support-agent-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Tools for an email support agent: lookup_customer_by_email,\
  Orders and products;detect duplicate_charge;check warranty windows;review ticket \
  history for repeat failures; issue refunds; and log the resolution.